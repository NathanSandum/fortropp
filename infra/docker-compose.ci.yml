services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://github.com
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    ports:
      - "${FORGEJO_PORT:?}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:13
    user: "0:0"
    environment:
      FORGEJO_RUNNER_TOKEN: ${FORGEJO_RUNNER_TOKEN:-}
    command:
      - sh
      - -c
      - >-
        { [ -f .runner ] || forgejo-runner register --no-interactive
        --instance http://forgejo:3000 --token "$$FORGEJO_RUNNER_TOKEN" --name fortropp-test
        --labels ubuntu-latest:docker://node:22-bookworm; }
        && exec forgejo-runner daemon --config /config.yaml
    volumes:
      - ./forgejo-runner.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      forgejo:
        condition: service_healthy
