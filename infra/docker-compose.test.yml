name: fortropp-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fortropp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fortropp
    ports:
      - "${POSTGRES_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortropp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      additional_contexts:
        site-config: ../worker/site-config
        metadata: ..
      args:
        CARGO_FEATURES: test-routes
    network_mode: "service:worker"
    environment:
      RUST_LOG: backend=debug,info
      DATABASE_URL: postgres://fortropp:${POSTGRES_PASSWORD:?}@postgres:5432/fortropp
      REDIS_URL: redis://redis:6379
      PORT: 8080
      S3_ENDPOINT: http://localhost:${WORKER_PORT:?}/cdn-cgi/local/r2/s3/
      S3_PUBLIC_ORIGIN: http://localhost:${WORKER_PORT:?}/cdn-cgi/local/r2/s3/
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY: fortropp-worker-s3
      S3_SECRET_KEY: fortropp-worker-s3-secret
      S3_REGION: auto
      KV_API_URL: http://localhost:${WORKER_PORT:?}/cdn-cgi/local/explorer/api
      KV_NAMESPACE_ID: fortropp-site-routes-e2e
      POSTMARK_API_URL: http://postmark:8080
      POSTMARK_SERVER_TOKEN: ${POSTMARK_TOKEN:?}
      MAIL_FROM: noreply@fortropp.local
      MAIL_REPLY_TO: support@fortropp.local
      FRONTEND_ORIGIN: https://localhost:${CADDY_PORT:?}
      COOKIE_SECURE: "true"
      DNS_NAMESERVER: pdns:53
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:?}
      ORIGIN_IPV4: 192.0.2.1
      ORIGIN_OVERRIDE_ROUND_SECONDS: 1
      DOMAIN_VERIFICATION_KEY: ${DOMAIN_VERIFICATION_KEY:?}
      SESSION_KEY: ${SESSION_KEY:?}
      SIGNUP: open
      TURNSTILE: "off"
      USER_CONTENT_DOMAIN: fortropp.test
      PREVIEW_PORT: ${CADDY_PORT:?}
      CLOUDFLARE_HOSTNAMES_API_URL: http://cloudflare-saas:8080/client/v4
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_SAAS_TOKEN:?}
      CLOUDFLARE_HOSTNAMES_ZONE_ID: fortropp-test-zone
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
      postmark:
        condition: service_healthy
      pdns:
        condition: service_healthy
      cloudflare-saas:
        condition: service_healthy

  cloudflare-saas:
    build: ./test-services
    environment:
      FAKE_CLOUDFLARE_TOKEN: ${CLOUDFLARE_SAAS_TOKEN:?}
    ports:
      - "${CLOUDFLARE_SAAS_PORT:?}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  postmark:
    build: ./test-services
    entrypoint: ["postmark"]
    environment:
      FAKE_POSTMARK_TOKEN: ${POSTMARK_TOKEN:?}
      FAKE_POSTMARK_MAILPIT_URL: http://mailpit:8025
    ports:
      - "${POSTMARK_PORT:?}:8080"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  pdns:
    image: powerdns/pdns-auth-51:5.1.4
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_API_KEY:?}
    ports:
      - "${PDNS_API_PORT:?}:8081"
    healthcheck:
      test: ["CMD", "pdns_control", "rping"]
      interval: 5s
      timeout: 5s
      retries: 5

  echo:
    build: ./test-services
    entrypoint: ["echo_server"]
    volumes:
      - echo_certificate:/certificate
    networks:
      default:
        aliases:
          - echo.fortropp.test
    healthcheck:
      test: ["CMD", "curl", "-skf", "https://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${MAILPIT_HTTP_PORT:?}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: ../worker
    environment:
      WRANGLER_PORT: ${WORKER_PORT:?}
      USER_CONTENT_DOMAIN: fortropp.test
      NODE_EXTRA_CA_CERTS: /certificate/echo.pem
    volumes:
      - echo_certificate:/certificate:ro
    depends_on:
      echo:
        condition: service_healthy
    ports:
      - "${WORKER_PORT:?}:${WORKER_PORT:?}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${WORKER_PORT:?}/cdn-cgi/local/explorer/api/storage/kv/namespaces"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2.11.4
    environment:
      CADDY_SITE_ADDRESS: localhost
      WORKER_ADDRESS: worker:${WORKER_PORT:?}
    ports:
      - "${CADDY_PORT:?}:443"
      - "${CADDY_HTTP_PORT:?}:80"
    healthcheck:
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./app-routes.caddy:/etc/caddy/app-routes.caddy
      - ../frontend/build:/srv
    depends_on:
      - backend

volumes:
  echo_certificate:
