name: fortropp-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fortropp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fortropp
    ports:
      - "${POSTGRES_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortropp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    environment:
      RUST_LOG: backend=debug,info
      DATABASE_URL: postgres://fortropp:${POSTGRES_PASSWORD:?}@postgres:5432/fortropp
      REDIS_URL: redis://redis:6379
      PORT: 8080
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ORIGIN: http://localhost:${S3_PROXY_PORT:?}
      S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:?}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      S3_REGION: us-east-1
      EXTERNAL_SETTINGS_S3_BUCKET_POLICY: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@fortropp.local
      FRONTEND_ORIGIN: http://localhost:${CADDY_PORT:?}
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${MAILPIT_HTTP_PORT:?}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3-proxy:
    image: caddy:2.11.4
    ports:
      - "${S3_PROXY_PORT:?}:80"
    volumes:
      - ./s3-proxy.Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      s3:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4
    ports:
      - "${CADDY_PORT:?}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../frontend/build:/srv
    depends_on:
      - backend
