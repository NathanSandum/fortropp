name: fortropp-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fortropp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fortropp
    ports:
      - "${POSTGRES_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortropp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      additional_contexts:
        site-config: ../dev-worker/site-config
    network_mode: "service:dev-worker"
    environment:
      RUST_LOG: backend=debug,info
      DATABASE_URL: postgres://fortropp:${POSTGRES_PASSWORD:?}@postgres:5432/fortropp
      REDIS_URL: redis://redis:6379
      PORT: 8080
      S3_ENDPOINT: http://localhost:${WORKER_PORT:?}/cdn-cgi/local/r2/s3/
      S3_PUBLIC_ORIGIN: http://localhost:${WORKER_PORT:?}/cdn-cgi/local/r2/s3/
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY: fortropp-dev-worker-s3
      S3_SECRET_KEY: fortropp-dev-worker-s3-secret
      S3_REGION: auto
      DEV_WORKER_URL: http://dev-worker:${WORKER_PORT:?}
      WORKER_KV_TOKEN: ${WORKER_KV_TOKEN:?}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@fortropp.local
      FRONTEND_ORIGIN: https://localhost:${CADDY_PORT:?}
      COOKIE_SECURE: "true"
      DNS_NAMESERVER: pdns:53
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:?}
      DOMAIN_VERIFICATION_KEY: ${DOMAIN_VERIFICATION_KEY:?}
      UPLOAD_ORIGIN: http://localhost:${WORKER_PORT:?}
      UPLOAD_TICKET_KEY: ${UPLOAD_TICKET_KEY:?}
      PREVIEW_ORIGIN: http://preview.localhost:${WORKER_PORT:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dev-worker:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      pdns:
        condition: service_healthy

  pdns:
    image: powerdns/pdns-auth-51:5.1.4
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_API_KEY:?}
    ports:
      - "${PDNS_API_PORT:?}:8081"
    healthcheck:
      test: ["CMD", "pdns_control", "rping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${MAILPIT_HTTP_PORT:?}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  dev-worker:
    build: ../dev-worker
    environment:
      WRANGLER_LOCAL: ${WRANGLER_LOCAL:-true}
      WRANGLER_PORT: ${WORKER_PORT:?}
      UPLOAD_TICKET_KEY: ${UPLOAD_TICKET_KEY:?}
      UPLOAD_ALLOWED_ORIGIN: https://localhost:${CADDY_PORT:?}
      PREVIEW_DOMAIN: preview.localhost
      WORKER_KV_TOKEN: ${WORKER_KV_TOKEN:?}
      INTERNAL_HOSTS: localhost,dev-worker
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "${WORKER_PORT:?}:${WORKER_PORT:?}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${WORKER_PORT:?}/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2.11.4
    environment:
      CADDY_SITE_ADDRESS: localhost
    ports:
      - "${CADDY_PORT:?}:443"
    healthcheck:
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../frontend/build:/srv
    depends_on:
      - backend
