services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortropp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fortropp
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortropp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      additional_contexts:
        site-config: ../worker/site-config
        metadata: ..
      args:
        CARGO_FEATURES: test-routes
    restart: unless-stopped
    network_mode: "service:worker"
    environment:
      DATABASE_URL: postgres://fortropp:${POSTGRES_PASSWORD:?}@postgres:5432/fortropp
      REDIS_URL: redis://redis:6379
      PORT: 8080
      S3_ENDPOINT: http://localhost:8787/cdn-cgi/local/r2/s3/
      S3_PUBLIC_ORIGIN: http://localhost:8787/cdn-cgi/local/r2/s3/
      S3_BUCKET: fortropp-site-files-e2e
      S3_ACCESS_KEY: fortropp-worker-s3
      S3_SECRET_KEY: fortropp-worker-s3-secret
      S3_REGION: auto
      KV_API_URL: http://localhost:8787/cdn-cgi/local/explorer/api
      KV_NAMESPACE_ID: fortropp-site-routes-e2e
      POSTMARK_API_URL: http://postmark:8080
      POSTMARK_SERVER_TOKEN: fortropp-dev-postmark
      MAIL_FROM: noreply@fortropp.local
      MAIL_REPLY_TO: support@fortropp.local
      FRONTEND_ORIGIN: https://localhost
      COOKIE_SECURE: "true"
      DNS_NAMESERVER: pdns:53
      EDGE_HOSTNAME: edge.fortropp.test
      ORIGIN_IPV4: 192.0.2.1
      ORIGIN_OVERRIDE_ROUND_SECONDS: 60
      DOMAIN_VERIFICATION_KEY: fortropp-dev-domain-verification-key
      SESSION_KEY: 49d7db009eea2a720bf81d94a6caaae704206a2f3d6dafa2f515144d5019f61628e85622ca8de56e2bfc9d6c354a6278c6d25d62ae0bb3c7e5344e2cd2752924
      SIGNUP: open
      TURNSTILE: preview
      USER_CONTENT_DOMAIN: fortropp.test
      CLOUDFLARE_HOSTNAMES_API_URL: http://cloudflare-saas:8080/client/v4
      CLOUDFLARE_API_TOKEN: fortropp-dev-cloudflare
      CLOUDFLARE_HOSTNAMES_ZONE_ID: fortropp-dev-zone
      STRIPE_API_URL: https://api.stripe.com
      STRIPE_SECRET_KEY:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
      postmark:
        condition: service_healthy
      pdns:
        condition: service_healthy
      cloudflare-saas:
        condition: service_healthy

  cloudflare-saas:
    build: ./test-services
    restart: unless-stopped
    environment:
      FAKE_CLOUDFLARE_TOKEN: fortropp-dev-cloudflare
    ports:
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  postmark:
    build: ./test-services
    entrypoint: ["postmark"]
    restart: unless-stopped
    environment:
      FAKE_POSTMARK_TOKEN: fortropp-dev-postmark
      FAKE_POSTMARK_MAILPIT_URL: http://mailpit:8025
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  pdns:
    image: powerdns/pdns-auth-51:5.1.4
    restart: unless-stopped
    environment:
      PDNS_AUTH_API_KEY: fortropp-dev-pdns
    ports:
      - "8082:8081"
      - "127.0.0.1:5300:53/udp"
      - "127.0.0.1:5300:53/tcp"
    volumes:
      - pdns_data:/var/lib/powerdns
      - ./pdns-dev.conf:/etc/powerdns/pdns.d/fortropp-dev.conf:ro
    healthcheck:
      test: ["CMD", "pdns_control", "rping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: ../worker
    restart: unless-stopped
    environment:
      WRANGLER_PORT: 8787
      USER_CONTENT_DOMAIN: fortropp.test
    ports:
      - "8787:8787"
      - "127.0.0.1:8080:8080"
    volumes:
      - ../worker:/app
      - worker_cargo:/usr/local/cargo/registry
      - worker_target:/app/target
      - worker_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/cdn-cgi/local/explorer/api/storage/kv/namespaces"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: localhost
      WORKER_ADDRESS: worker:8787
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./app-routes.caddy:/etc/caddy/app-routes.caddy
      - ../frontend/build:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  worker_cargo:
  worker_target:
  worker_data:
  pdns_data:
