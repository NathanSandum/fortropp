services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortropp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fortropp
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortropp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fortropp:${POSTGRES_PASSWORD:?}@postgres:5432/fortropp
      REDIS_URL: redis://redis:6379
      PORT: 8080
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ORIGIN: http://localhost:9002
      S3_BUCKET_PREFIX: fortropp-site-files
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fortropp}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      S3_REGION: us-east-1
      EXTERNAL_SETTINGS_S3_BUCKET_POLICY: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@fortropp.local
      FRONTEND_ORIGIN: http://localhost
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z 
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fortropp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  dev-worker:
    build: ../dev-worker
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ../dev-worker:/app
      - dev_worker_cargo:/usr/local/cargo/registry
      - dev_worker_target:/app/target
      - dev_worker_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  s3-proxy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "9002:80"
    volumes:
      - ./s3-proxy.Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      s3:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../frontend/build:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  s3_data:
  dev_worker_cargo:
  dev_worker_target:
  dev_worker_data:
