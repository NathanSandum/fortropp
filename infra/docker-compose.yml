services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortropp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fortropp
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortropp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    restart: unless-stopped
    network_mode: "service:dev-worker"
    environment:
      DATABASE_URL: postgres://fortropp:${POSTGRES_PASSWORD:?}@postgres:5432/fortropp
      REDIS_URL: redis://redis:6379
      PORT: 8080
      S3_ENDPOINT: http://localhost:8787/cdn-cgi/local/r2/s3/
      S3_PUBLIC_ORIGIN: http://localhost:8787/cdn-cgi/local/r2/s3/
      S3_BUCKET: fortropp-site-files-e2e
      S3_ACCESS_KEY: fortropp-dev-worker-s3
      S3_SECRET_KEY: fortropp-dev-worker-s3-secret
      S3_REGION: auto
      DEV_WORKER_URL: http://dev-worker:8787
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@fortropp.local
      FRONTEND_ORIGIN: http://localhost
      COOKIE_SECURE: "false"
      DNS_NAMESERVER: pdns:53
      EDGE_HOSTNAME: edge.fortropp.test
      DOMAIN_VERIFICATION_KEY: fortropp-dev-domain-verification-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dev-worker:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      pdns:
        condition: service_healthy

  pdns:
    image: powerdns/pdns-auth-51:5.1.4
    restart: unless-stopped
    environment:
      PDNS_AUTH_API_KEY: fortropp-dev-pdns
    ports:
      - "8082:8081"
    volumes:
      - pdns_data:/var/lib/powerdns
    healthcheck:
      test: ["CMD", "pdns_control", "rping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  dev-worker:
    build: ../dev-worker
    restart: unless-stopped
    environment:
      WRANGLER_LOCAL: ${WRANGLER_LOCAL:-true}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "8787:8787"
    volumes:
      - ../dev-worker:/app
      - dev_worker_cargo:/usr/local/cargo/registry
      - dev_worker_target:/app/target
      - dev_worker_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../frontend/build:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  dev_worker_cargo:
  dev_worker_target:
  dev_worker_data:
  pdns_data:
