[package]
name = "test-services"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.18.1", features = ["rustls-0_23"] }
awc = "3.11.0"
jiff = "0.2.38"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
disallowed_methods = "deny"

[dev-dependencies]
actix-http = "3.20.0"
actix-test = "0.1.6"
jsonschema = "0.60.1"
