name: fortropp

services:
  caddy:
    image: registry.digitalocean.com/fortropp/frontend:${FORTROPP_VERSION:?}
    restart: unless-stopped
    environment:
      CLOUDFLARE_RANGES: ${CLOUDFLARE_RANGES:?}
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/fortropp/origin.pem:/etc/fortropp/origin.pem:ro
      - /etc/fortropp/origin-key.pem:/etc/fortropp/origin-key.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    env_file:
      - /etc/fortropp/alloy-secrets.env
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - alloy_data:/var/lib/alloy/data

  backend:
    image: registry.digitalocean.com/fortropp/backend:${FORTROPP_VERSION:?}
    restart: unless-stopped
    env_file:
      - backend.env
      - /etc/fortropp/backend-secrets.env
    environment:
      RUST_LOG: backend=info,warn
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  alloy_data:
