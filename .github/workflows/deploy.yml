name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TARGET: root@${{ secrets.DEPLOY_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Not a release tag: $VERSION"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Write the secrets
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          ORIGIN_CERTIFICATE: ${{ secrets.ORIGIN_CERTIFICATE }}
          ORIGIN_PRIVATE_KEY: ${{ secrets.ORIGIN_PRIVATE_KEY }}
        run: |
          ssh "$TARGET" 'install -m 700 -d /etc/fortropp /opt/fortropp'
          printf '%s\n' "$BACKEND_ENV" | ssh "$TARGET" 'umask 077 && cat > /etc/fortropp/backend-secrets.env'
          printf '%s\n' "$ORIGIN_CERTIFICATE" | ssh "$TARGET" 'umask 077 && cat > /etc/fortropp/origin.pem'
          printf '%s\n' "$ORIGIN_PRIVATE_KEY" | ssh "$TARGET" 'umask 077 && cat > /etc/fortropp/origin-key.pem'
      - name: Copy the release
        env:
          CLOUDFLARE_RANGES: ${{ vars.CLOUDFLARE_RANGES }}
        run: |
          scp infra/production/docker-compose.yml infra/production/backend.env "$TARGET:/opt/fortropp/"
          printf 'FORTROPP_VERSION=%s\nCLOUDFLARE_RANGES=%s\n' "$VERSION" "$CLOUDFLARE_RANGES" | ssh "$TARGET" 'cat > /opt/fortropp/.env'
      - name: Log in to the registry
        env:
          REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
        run: printf '%s\n' "$REGISTRY_READ_TOKEN" | ssh "$TARGET" 'read -r token && printf "%s" "$token" | docker login registry.digitalocean.com --username "$token" --password-stdin'
      - name: Start the release
        run: ssh "$TARGET" 'cd /opt/fortropp && docker compose pull && docker compose up -d --remove-orphans'
      - name: Check fortropp.dev answers through Cloudflare
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null https://fortropp.dev/.well-known/oauth-authorization-server
